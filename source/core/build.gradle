[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/main/" ]
sourceSets.test.java.srcDirs = [ "src/test/" ]

eclipse.project.name = appName + "-core"

test {
    useJUnitPlatform()
    workingDir = new File("../core/assets")
    finalizedBy jacocoTestReport

    // Load Mockito's existing Byte Buddy agent at JVM startup instead of relying on self-attachment.
    doFirst {
        def agentJar = configurations.testRuntimeClasspath.find {
            it.name.startsWith('byte-buddy-agent-') && it.name.endsWith('.jar')
        }
        if (agentJar == null) {
            throw new GradleException("Byte Buddy agent is missing from the test runtime classpath")
        }
        jvmArgs "-javaagent:${agentJar.absolutePath}"
    }

    jacoco {
        destinationFile = file("$buildDir/jacoco/jacocoTest.exec")
    }
}


jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

javadoc {
    options {
        links 'https://javadoc.io/doc/com.badlogicgames.gdx/gdx/latest/com/badlogic/gdx/package-summary.html'
        tags = ['require', 'requires', 'ensure', 'ensures']
    }
}
